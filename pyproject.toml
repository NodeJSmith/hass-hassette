[project]
name = "hass-hassette"
version = "0.0.0"
description = "Home Assistant custom integration for Hassette"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.14.9",
]
test = [
    "hassette-client==0.56.0",
    "pytest-cov>=7.0.0",
    "pytest-homeassistant-custom-component==0.13.371",
]

[tool.uv]
package = false
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components.hassette --cov-report=term-missing --cov-fail-under=95"
