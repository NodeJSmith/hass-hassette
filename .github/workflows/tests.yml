name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    latest:
        name: Tests (latest HA)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
              with:
                  python-version: "3.14"
                  enable-cache: true

            - run: uv sync --locked

            - run: uv run pytest

    floor:
        # The oldest HA hacs.json claims. Raise this pin, and hacs.json's "homeassistant", only in the
        # change that starts using a newer HA API. pytest-homeassistant's version is the HA release it installs.
        name: Tests (HA floor)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            FLOOR_PYTEST_HA: "2026.11.0"
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
              with:
                  python-version: "3.14"

            - name: Install the floor HA with the manifest's client pin
              run: |
                  requirement=$(python3 -c 'import json; print(json.load(open("custom_components/hassette/manifest.json"))["requirements"][0])')
                  uv venv
                  uv pip install "pytest-homeassistant==${FLOOR_PYTEST_HA}" "$requirement" pytest-cov
                  # pytest-homeassistant doesn't install integration libraries; add hassio's, as this HA pins it.
                  uv run --no-sync python -c 'import json, pathlib, homeassistant; print("\n".join(json.loads((pathlib.Path(homeassistant.__file__).parent / "components/hassio/manifest.json").read_text())["requirements"]))' > hassio-requirements.txt
                  uv pip install -r hassio-requirements.txt

            - name: Check the floor matches hacs.json
              run: |
                  ha=$(uv run --no-sync python -c 'from homeassistant.const import __version__; print(__version__)')
                  claimed=$(python3 -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')
                  if [ "$ha" != "$claimed" ]; then
                      echo "::error::The floor job runs HA $ha but hacs.json claims $claimed"
                      exit 1
                  fi

            - run: uv run --no-sync pytest

    # The required check for this workflow.
    tests-complete:
        needs: [latest, floor]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Report result
              run: |
                  failed="${{ contains(needs.*.result, 'failure') }}"
                  cancelled="${{ contains(needs.*.result, 'cancelled') }}"
                  if [[ "$failed" == "true" || "$cancelled" == "true" ]]; then
                      echo "One or more test jobs failed or were cancelled"
                      exit 1
                  fi
                  echo "All tests passed"
