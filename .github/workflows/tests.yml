name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    latest:
        name: Tests (latest HA)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
              with:
                  python-version: "3.14"
                  enable-cache: true

            - run: uv sync --locked

            - run: uv run pytest

    floor:
        # The oldest HA hacs.json claims. Raise this pin, and hacs.json's "homeassistant", only in the
        # change that starts using a newer HA API: pytest-homeassistant-custom-component 0.13.363 is HA 2026.9.0.
        name: Tests (HA floor)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            FLOOR_PHCC: "0.13.363"
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0
              with:
                  python-version: "3.14"

            - name: Install the floor HA with the manifest's client pin
              run: |
                  requirement=$(python3 -c 'import json; print(json.load(open("custom_components/hassette/manifest.json"))["requirements"][0])')
                  uv venv
                  uv pip install "pytest-homeassistant-custom-component==${FLOOR_PHCC}" "$requirement" pytest-cov

            - name: Check the floor matches hacs.json
              run: |
                  ha=$(uv run --no-sync python -c 'from homeassistant.const import __version__; print(__version__)')
                  claimed=$(python3 -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')
                  if [ "$ha" != "$claimed" ]; then
                      echo "::error::The floor job runs HA $ha but hacs.json claims $claimed"
                      exit 1
                  fi

            - run: uv run --no-sync pytest
