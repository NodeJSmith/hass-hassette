line-length = 120
target-version = "py314"
force-exclude = true

[lint]
select = [
    "ASYNC", # flake8-async
    "E",     # pycodestyle (error)
    "W",     # pycodestyle (warning)
    "F",     # pyflakes
    "UP",    # pyupgrade
    "C4",    # flake8-comprehensions
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "RUF",   # ruff
    "S",     # flake8-bandit (security)
    "I",     # isort
    "PT",    # flake8-pytest-style
    "B",     # bugbear
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "N",     # pep8-naming
    "PERF",  # perflint
]
# Home Assistant passes `hass` and `**kwargs` to callbacks that don't always use them.
ignore = ["ARG001", "ARG002"]

[lint.per-file-ignores]
"tests/**" = ["S101"]

[lint.isort]
known-first-party = ["custom_components"]
