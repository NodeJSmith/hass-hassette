# Git hooks, run by prek (https://prek.j178.dev).
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending" },
    { id = "check-case-conflict" },
    { id = "check-json" },
    { id = "check-yaml" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.46.3"
hooks = [
    { id = "typos", args = ["--force-exclude"], stages = ["pre-commit", "pre-push"] },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    # `gitleaks git --staged` scans only the index, which is empty at pre-push and in CI.
    { id = "gitleaks", stages = ["pre-commit"] },
    # The whole tracked tree, for pre-push and CI (lint.yml), so a commit made without local hooks is scanned too.
    { id = "gitleaks", alias = "gitleaks-tree", name = "Detect hardcoded secrets (tracked tree)", entry = "./tools/scan_tracked_secrets.sh", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]

[[repos]]
repo = "local"

# Run through uv so the hooks use the ruff pinned in uv.lock rather than a second copy.
[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
language = "system"
entry = "uv run ruff check --fix"
types = ["python"]

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
language = "system"
entry = "uv run ruff format"
types = ["python"]

# HSL102 (file size) is excluded here; growth past it is gated by the `check-file-size-regressions`
# hook below and the `file-sizes` job in lint.yml.
[[repos.hooks]]
id = "house-lint"
name = "house-lint"
language = "system"
entry = "uv run house-lint check --ignore HSL102"
files = '^(custom_components|tests|tools)/.*\.py$'
require_serial = true
stages = ["pre-commit", "pre-push"]

[[repos.hooks]]
id = "pyright"
name = "pyright"
language = "system"
entry = "uv run pyright"
pass_filenames = false
types = ["python"]
stages = ["pre-push"]

[[repos.hooks]]
id = "zizmor"
name = "zizmor (GitHub Actions security)"
language = "system"
entry = "env -u GH_TOKEN -u GITHUB_TOKEN uvx zizmor@1.26.1 --offline"
files = '^\.github/workflows/'
stages = ["pre-commit", "pre-push"]

# These two compare against origin/main, so they run at pre-push only; lint.yml runs them in their own
# jobs against the PR's exact base/head SHAs.
[[repos.hooks]]
id = "check-file-size-regressions"
name = "Check for new file-size regressions"
language = "system"
entry = "uv run python tools/check_file_size_regressions.py origin/main HEAD"
pass_filenames = false
require_serial = true
types = ["python"]
stages = ["pre-push"]

[[repos.hooks]]
id = "check-duplicate-code"
name = "Check for new 3+-way duplicate code (PMD CPD, needs Java 21)"
language = "system"
entry = "uv run python tools/check_duplicate_code.py --gate-new-code origin/main HEAD"
pass_filenames = false
require_serial = true
types = ["python"]
stages = ["pre-push"]

[[repos.hooks]]
id = "no-mypy-ignore"
name = 'Ban "type: ignore" comments (use pyright)'
language = "pygrep"
types = ["python"]
entry = "# type: ignore"

[[repos.hooks]]
id = "no-future-annotations"
name = "Ban from __future__ import annotations"
language = "pygrep"
types = ["python"]
entry = "^from __future__ import annotations"
